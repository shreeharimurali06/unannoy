  <text x="158" y="127" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#20182e">Unannoy</text>
  <text x="96" y="282" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#20182e">Tiny tools for wildly</text>
  <text x="96" y="372" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#20182e">annoying tasks.</text>
  <text x="100" y="438" font-family="Inter, Arial, sans-serif" font-size="30" fill="#6d5e7d">Clean text, count words, format JSON, preview Markdown.</text>
